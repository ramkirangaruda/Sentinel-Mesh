; SentinelMesh firmware — PlatformIO project
; Boards: 3x ESP32-WROOM-32 dev boards (field node, gateway, attacker), Arduino framework,
; plus a 4th "Monitor" board (v4, docs/v4_energy_split.md) for the INA219 energy rig.
; Shared protocol code lives in lib/sentinel_proto (portable C++, no Arduino.h dependency
; in the core so it can also be unit-tested on the host — see test/test_native and
; README.md "Host-side unit tests").

[platformio]
default_envs = field_node, gateway, attacker

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Isrc                    ; so `#include "common/board_config.h"` resolves
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
; The BOM's "OLED" (SSD1306/GFX) and the Adafruit MPU6050 library were
; dropped: bring-up on real hardware found the display is actually a 16x2
; LCD behind an I2C backpack (LiquidCrystal_I2C instead), and the MPU6050
; breakout in hand is a clone whose WHO_AM_I register fails Adafruit's
; identity check even though the chip works fine -- field_node/main.cpp
; now talks to it with a small direct-I2C driver instead of that library.
; wolfSSL is scoped to env:benchmark, the only code that includes it. Listed
; here it was built into every board, and it fails to build on Arduino-ESP32
; ("Found both ESPIDF and ARDUINO. Pick one."), which broke field_node,
; gateway and attacker even though none of them uses it yet. When the real
; handshake needs it, add it back per-env together with the build config that
; resolves that clash (the benchmark will show whether it has been).

[env:field_node]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1

[env:gateway]
build_src_filter = +<gateway/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_GATEWAY -DSENTINEL_NODE_ID=2

[env:attacker]
build_src_filter = +<attacker/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_ATTACKER -DSENTINEL_NODE_ID=3

[env:benchmark]
; Standalone crypto benchmark sketch — flash to any of the 3 boards to get
; ML-KEM-512/768/1024 + ML-DSA-44 timing/heap/stack numbers before wiring
; the real handshake in. See src/benchmark/main.cpp.
build_src_filter = +<benchmark/>
lib_deps =
    ${env.lib_deps}
    ; Crypto: wolfSSL first choice for ML-KEM / ML-DSA. If wolfCrypt's PQC
    ; build doesn't fit/compile for this target, switch this line to a
    ; PQClean-based Arduino wrapper (see firmware/README.md).
    wolfssl/wolfSSL @ ^5.7.0

[env:monitor]
; v4 (docs/v4_energy_split.md task 1): the 4th ("Monitor") ESP32 running the
; INA219 energy rig. Only this env needs the INA219 library, so it's scoped
; here rather than added to the shared [env] lib_deps. See src/monitor/main.cpp.
build_src_filter = +<monitor/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_MONITOR
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit INA219 @ ^1.2.3

; Host-side unit tests (no ESP32 hardware needed) for the portable parts of
; sentinel_proto: packet header, fragmentation/reassembly, replay window,
; cookie challenge, energy budget, EnergyGate stand-in (v4). PlatformIO
; isn't available in this sandbox, so these are also runnable directly with
; g++ — see README.md. This env is here for when `pio` *is* available (e.g.
; on the real dev machine): `pio test -e native`.
[env:native]
platform = native
build_flags = -std=gnu++17 -Ilib/sentinel_proto/include
test_filter = test_native/*
