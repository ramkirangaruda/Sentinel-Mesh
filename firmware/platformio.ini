; SentinelMesh firmware — PlatformIO project
; Boards: 3x ESP32-WROOM-32 dev boards (field node, gateway, attacker), Arduino framework,
; plus a 4th "Monitor" board (v4, docs/v4_energy_split.md) for the INA219 energy rig.
; Shared protocol code lives in lib/sentinel_proto (portable C++, no Arduino.h dependency
; in the core so it can also be unit-tested on the host — see test/test_native and
; README.md "Host-side unit tests").

[platformio]
default_envs = field_node, gateway, attacker

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Isrc                    ; so `#include "common/board_config.h"` resolves
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
; Post-quantum crypto comes from the vendored PQClean library in lib/pqclean/
; (used by env:benchmark; the real handshake will add it per-env). wolfSSL is
; not used: it fails to build on Arduino-ESP32 ("Found both ESPIDF and ARDUINO").

; Post-quantum build flags shared by every role (vendored PQClean, see lib/pqclean).
; The NIST level pair defaults to 3 (ML-KEM-768 + ML-DSA-65); the *_l1 envs below
; build ML-KEM-512 + ML-DSA-44. ML-DSA-87 does not fit the ESP32 (paper E1).
[pqc]
build_flags =
    -DSENTINEL_PQC_BACKEND_PQCLEAN
    -Ilib/pqclean/src
    -Ilib/pqclean/src/pqclean/common
    -O2

[env:field_node]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1

[env:gateway]
build_src_filter = +<gateway/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_GATEWAY -DSENTINEL_NODE_ID=2

[env:attacker]
build_src_filter = +<attacker/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_ATTACKER -DSENTINEL_NODE_ID=3

; Attackers that start attacking at power-up (no serial needed, for a board on a charger or on the
; rig's second INA219). The mode is NOT remembered across power cycles in env:attacker.
[env:attacker_flood]
build_src_filter = +<attacker/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_ATTACKER -DSENTINEL_NODE_ID=3
    -DSENTINEL_ATTACKER_BOOT_MODE=FLOOD

[env:attacker_insider]
build_src_filter = +<attacker/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_ATTACKER -DSENTINEL_NODE_ID=3
    -DSENTINEL_ATTACKER_BOOT_MODE=INSIDER

[env:attacker_slowdrip]
build_src_filter = +<attacker/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_ATTACKER -DSENTINEL_NODE_ID=3
    -DSENTINEL_ATTACKER_BOOT_MODE=SLOW_DRIP

; --- Level 1 (ML-KEM-512 + ML-DSA-44): same firmware, smaller parameter set ---
[env:field_node_l1]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1 -DSENTINEL_PQC_LEVEL=1

[env:gateway_l1]
build_src_filter = +<gateway/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_GATEWAY -DSENTINEL_NODE_ID=2 -DSENTINEL_PQC_LEVEL=1

[env:attacker_l1]
build_src_filter = +<attacker/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_ATTACKER -DSENTINEL_NODE_ID=3 -DSENTINEL_PQC_LEVEL=1

; --- Energy-measurement field node (paper E3-E5): powered ONLY through the INA219, no USB.
; No OLED / tamper sensors / LED / buzzer (they would be counted as protocol energy),
; GPIO4 marker around the gate decision and the handshake computation, battery_pct fixed
; at 100 (SIMULATED: no cell on the rig), per-decision logging off.
; Bench variant for a bare board on USB (no sensors wired): same as the energy build but with
; logging on and no GPIO4 marker. Use this to check the handshake before the energy rig exists.
[env:field_node_bench]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1
    -DSENTINEL_MEASUREMENT_BUILD -DSENTINEL_NO_BATTERY -DSENTINEL_BENCH_LOGS

; Ablation: the same bench build with gate policy v1 (a low score is DROPPED, which also drops the real
; gateway under a same-id flood). Compare against env:field_node_bench (policy v2) in the paper.
[env:field_node_bench_gatev1]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1
    -DSENTINEL_MEASUREMENT_BUILD -DSENTINEL_NO_BATTERY -DSENTINEL_BENCH_LOGS -DSENTINEL_GATE_V1

[env:field_node_energy]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1
    -DSENTINEL_MEASUREMENT_BUILD -DSENTINEL_NO_BATTERY -DSENTINEL_ENERGY_MARKERS

[env:field_node_energy_l1]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} ${pqc.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1
    -DSENTINEL_MEASUREMENT_BUILD -DSENTINEL_NO_BATTERY -DSENTINEL_ENERGY_MARKERS -DSENTINEL_PQC_LEVEL=1

[env:benchmark]
; Standalone crypto benchmark sketch -- flash to any ESP32 board to get
; ML-KEM-512/768/1024 + ML-DSA-44/65/87 timing/heap/stack numbers and the
; classical baselines. See src/benchmark/main.cpp.
; Backend: PQClean "clean" C vendored in lib/pqclean/ (see its README.md).
; wolfSSL was removed here: it never built on Arduino-ESP32 ("Found both
; ESPIDF and ARDUINO"). The wolfSSL code path in main.cpp is left unused.
build_src_filter = +<benchmark/>
build_flags =
    ${env.build_flags}
    -DSENTINEL_PQC_BACKEND_PQCLEAN
    -Ilib/pqclean/src
    -Ilib/pqclean/src/pqclean/common
    -O2
lib_deps =
    ${env.lib_deps}

[env:monitor]
; v4 (docs/v4_energy_split.md task 1): the 4th ("Monitor") ESP32 running the
; current-sense energy rig. Team had an ADS1115 precision ADC on hand rather
; than the INA219 originally assumed here -- see src/monitor/main.cpp and
; docs/hardware_setup.md for why the shunt placement differs as a result.
; Only this env needs the ADC library, so it's scoped here rather than added
; to the shared [env] lib_deps.
build_src_filter = +<monitor/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_MONITOR
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ADS1X15 @ ^2.4.0

[env:monitor_ina219]
; Monitor with an INA219 (high-side, no ground lift, 0.1 mA resolution).
; THE ENV TO USE FOR THE PAPER once the INA219 arrives. See docs/hardware_setup.md.
build_src_filter = +<monitor/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_MONITOR -DSENTINEL_SENSOR_INA219
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit INA219 @ ^1.2.3

[env:benchmark_energy]
; Same benchmark, built for the energy pass: raises GPIO4 (marker) around every
; timed op, repeats the whole suite BENCH_REPEAT times, waits 10 s idle at boot.
; Power the board ONLY through the sensor (no USB). Pair with env:monitor_ina219.
build_src_filter = +<benchmark/>
build_flags =
    ${env.build_flags}
    -DSENTINEL_PQC_BACKEND_PQCLEAN
    -DSENTINEL_BENCH_MARKER
    -DSENTINEL_MEASUREMENT_BUILD
    -DBENCH_REPEAT=20
    -Ilib/pqclean/src
    -Ilib/pqclean/src/pqclean/common
    -O2
lib_deps = ${env.lib_deps}

; Host-side unit tests (no ESP32 hardware needed) for the portable parts of
; sentinel_proto: packet header, fragmentation/reassembly, replay window,
; cookie challenge, energy budget, EnergyGate stand-in (v4). PlatformIO
; isn't available in this sandbox, so these are also runnable directly with
; g++ — see README.md. This env is here for when `pio` *is* available (e.g.
; on the real dev machine): `pio test -e native`.
[env:native]
platform = native
build_flags = -std=gnu++17 -Ilib/sentinel_proto/include
test_filter = test_native/*
